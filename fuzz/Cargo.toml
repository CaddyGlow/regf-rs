[package]
name = "regf-rs-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.regf-rs]
path = ".."

# Its own workspace, so the fuzz crate and its nightly-only build never touch
# the library's.
[workspace]
members = ["."]

[[bin]]
name = "hive"
path = "fuzz_targets/hive.rs"
test = false
doc = false
bench = false
